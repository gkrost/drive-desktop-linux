# ClamAV daemon configuration file
# This is a template - placeholders will be replaced at runtime

# Log file location
LogFile LOGFILE_PATH

# Database directory
DatabaseDirectory DATABASE_DIRECTORY

# TCP server configuration
TCPSocket 3310
TCPAddr 127.0.0.1

# Security settings
User internxt
ScanMail false
ScanArchive true
ScanPE true
ScanELF true
ScanOLE2 true
ScanPDF true
ScanSWF true

# Performance settings
MaxScanSize 400M
MaxFileSize 2G
ReadTimeout 600

# Logging
LogTime yes
LogSyslog false
LogRotate yes
LogFacility LOG_LOCAL6

# Other settings
DetectPUA yes
ScanHTML yes
AlgorithmicDetection yes