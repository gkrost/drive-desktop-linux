# Freshclam configuration file
# This is a template - placeholders will be replaced at runtime

# Database directory
DatabaseDirectory DATABASE_DIRECTORY

# Log file location
UpdateLogFile FRESHCLAM_LOG_PATH

# Database mirror
DatabaseMirror database.clamav.net

# Settings
Checks 24 times per day
ConnectTimeout 60
ReceiveTimeout 60

# Logging
LogTime yes
LogVerbose yes
LogRotate yes

# Proxy settings (commented out by default)
# HTTPProxyServer yourproxy.server.com
# HTTPProxyPort 8080

# Additional settings
SafeBrowsing yes
Bytecode yes